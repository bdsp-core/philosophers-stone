name: Tests

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run fast tests
        run: python -m pytest

      - name: Build package
        run: python -m build

      - name: Check CLI and compatibility imports
        run: |
          philosophers-stone --help
          python - <<'PY'
          from philosophers_stone import Config, infer_brain_health
          from phi_utils.philosopher_utils import Config as LegacyConfig
          assert LegacyConfig is Config
          assert callable(infer_brain_health)
          PY
